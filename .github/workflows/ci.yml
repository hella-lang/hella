# CI: workspace tests + every example builds + every stdlib example runs,
# on Ubuntu, Windows, and macOS. All steps run under bash (Git Bash on
# Windows) so loops, pipes, and grep work identically everywhere.
#
# LLVM 21 is required by inkwell/llvm-sys 211 and must match exactly:
# Ubuntu gets it from apt.llvm.org, macOS from the llvm@21 keg,
# Windows from prebuilt upstream binaries.
name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM 21 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          # llvm-sys links Polly statically: needs the dev package too.
          sudo apt-get install -y llvm-21-dev clang-21 libpolly-21-dev
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          LLVMPREFIX="$(brew --prefix llvm@21)"
          echo "LLVM_SYS_211_PREFIX=${LLVMPREFIX}" >> "$GITHUB_ENV"
          echo "${LLVMPREFIX}/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        run: |
          # Upstream clang+llvm tarball: deterministic pin, no installer
          # quirks (the .exe installer silently landed nowhere), ships
          # llvm-config.exe + dev libs that llvm-sys needs.
          # Pin 21.1.8 (newest 21.1.x; matches Linux/macOS drift).
          # NOTE: codegen tests segfault nondeterministically on Windows
          # (STATUS_ACCESS_VIOLATION; different survivors per run, same
          # snippets pass on Linux/macOS) — under investigation, see the
          # triage step below. Not an LLVM-version issue (21.1.0 and 21.1.8
          # behave the same).
          curl -sSLf -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz
          mkdir -p C:/LLVM
          tar -xf llvm.tar.xz -C C:/LLVM --strip-components=1
          if [ ! -x "C:/LLVM/bin/llvm-config.exe" ]; then
            echo "llvm-config.exe missing; C:/LLVM/bin tree:"
            ls "C:/LLVM/bin" | head -30
            exit 1
          fi
          C:/LLVM/bin/llvm-config.exe --version
          echo "C:/LLVM/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_211_PREFIX=C:/LLVM" >> "$GITHUB_ENV"

      # llvm-config --system-libs names libs the tarball does not ship
      # (currently libxml2s.lib). Nothing we link — IR building and
      # object emission — references XML symbols, so a stub archive
      # satisfies link.exe: unreferenced members are never pulled in.
      # If a future LNK2001 names real xml symbols, this needs revisit.
      - name: Stub missing LLVM system libs (Windows)
        if: runner.os == 'Windows'
        run: |
          ls C:/LLVM/lib | grep -i -E "xml|zstd" || echo "(no xml/zstd libs shipped)"
          cd "$RUNNER_TEMP"
          for lib in xml2s; do
            if [ ! -f "C:/LLVM/lib/lib${lib}.lib" ]; then
              echo "void hella_stub_${lib}(void) {}" > "stub_${lib}.c"
              "C:/LLVM/bin/clang.exe" -c "stub_${lib}.c" -o "stub_${lib}.o"
              "C:/LLVM/bin/llvm-ar.exe" rcs "C:/LLVM/lib/lib${lib}.lib" "stub_${lib}.o"
              echo "stubbed lib${lib}.lib"
            fi
          done

      # Native-debug the Windows codegen-test segfault: run one crashing
      # test under cdb (ships with the VS/SDK toolset; probed, never
      # assumed) and print the fault + native stack. Purely informational,
      # always exits 0. Replaces the earlier crash-map probes: a stack
      # trace names the exact crashing call, no inference needed.
      - name: Debug lib test crash (Windows)
        if: always() && runner.os == 'Windows'
        timeout-minutes: 30
        run: |
          set +e
          CDB=""
          if [ -x "C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" ]; then
            CDB="C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          else
            echo "probing for cdb:"
            ls "C:/Program Files (x86)/Windows Kits/10/Debuggers/" 2>&1 || true
            CDB="$(find 'C:/Program Files (x86)/Windows Kits' -name 'cdb.exe' 2>/dev/null | grep -i '/x64/' | head -1)"
          fi
          echo "CDB=$CDB"
          if [ -z "$CDB" ] || [ ! -x "$CDB" ]; then
            echo "NO-CDB-AVAILABLE"
            exit 0
          fi
          TEST_EXE="$(ls -t target/debug/deps/hella_compiler-*.exe 2>/dev/null | head -1)"
          if [ ! -x "$TEST_EXE" ]; then
            echo "NO-TEST-BINARY"
            exit 0
          fi
          echo "TEST_EXE=$TEST_EXE"
          TEST_WIN="$(cygpath -w "$TEST_EXE")"
          for i in 1 2 3 4; do
            echo "--- cdb attempt $i ---"
            "$CDB" -g -G -c "g;.lastevent;r;k L100;lm m LLVM*;q" "$TEST_WIN" --test-threads=1 --exact codegen::tests::void_extension_method_verifies > /tmp/cdb-run.log 2>&1
            grep -i -m1 "c0000005\|access violation" /tmp/cdb-run.log && break
            echo "(no crash captured)"
          done
          A="$(grep -n -m1 -i "last event" /tmp/cdb-run.log | cut -d: -f1)"
          B="$(grep -n -m1 "^quit" /tmp/cdb-run.log | cut -d: -f1)"
          if [ -n "$A" ] && [ -n "$B" ]; then
            sed -n "${A},${B}p" /tmp/cdb-run.log | head -100
          else
            tail -30 /tmp/cdb-run.log
          fi
          echo "=== llvm modules loaded ==="
          grep -i "llvm" /tmp/cdb-run.log | head -10
          exit 0

      - name: Workspace tests
        run: cargo test --workspace

      # cargo test compiles bins only as test harnesses under
      # target/debug/deps — the runnable CLI needs an explicit build.
      - name: Build CLI
        run: cargo build

      - name: Build every example
        run: |
          for f in examples/*.hll; do
            ./target/debug/hella build -f "$f" --force || exit 1
          done

      - name: Run stdlib examples
        # Collect every result before failing so one bad example does
        # not hide the rest. PIPESTATUS is captured on the very next
        # line after each pipeline (anything in between clobbers it),
        # and errexit is off so a failing stage cannot abort the step.
        run: |
          fail=0
          set +e
          set -o pipefail
          printf 'Ada\n42\n' | ./examples/stdlib_io
          rc=(${PIPESTATUS[@]})
          echo "io printf_rc=${rc[0]} bin_rc=${rc[1]}"
          [ "${rc[1]}" -eq 0 ] || fail=1
          ./examples/stdlib_math | grep -q "math ok"
          rc=(${PIPESTATUS[@]})
          echo "math bin_rc=${rc[0]} grep_rc=${rc[1]}"
          { [ "${rc[0]}" -eq 0 ] && [ "${rc[1]}" -eq 0 ]; } || fail=1
          # Linux only: unbuffer stdout so a crash no longer swallows
          # all evidence — with block buffering an abort before exit
          # flush hides whether println was even reached.
          if [ "$(uname)" = "Linux" ]; then STDBUF="stdbuf -o0"; else STDBUF=""; fi
          $STDBUF ./examples/stdlib_string | grep -q "string ok"
          rc=(${PIPESTATUS[@]})
          echo "str bin_rc=${rc[0]} grep_rc=${rc[1]}"
          { [ "${rc[0]}" -eq 0 ] && [ "${rc[1]}" -eq 0 ]; } || fail=1
          ./examples/stdlib_env | grep -q "env ok"
          rc=(${PIPESTATUS[@]})
          echo "env bin_rc=${rc[0]} grep_rc=${rc[1]}"
          { [ "${rc[0]}" -eq 0 ] && [ "${rc[1]}" -eq 0 ]; } || fail=1
          ./examples/stdlib_fs | grep -q "fs ok"
          rc=(${PIPESTATUS[@]})
          echo "fs bin_rc=${rc[0]} grep_rc=${rc[1]}"
          { [ "${rc[0]}" -eq 0 ] && [ "${rc[1]}" -eq 0 ]; } || fail=1
          ./examples/stdlib_collections | grep -q "collections ok"
          rc=(${PIPESTATUS[@]})
          echo "collections bin_rc=${rc[0]} grep_rc=${rc[1]}"
          { [ "${rc[0]}" -eq 0 ] && [ "${rc[1]}" -eq 0 ]; } || fail=1
          ./examples/stdlib_fmt | grep -q "fmt ok"
          rc=(${PIPESTATUS[@]})
          echo "fmt bin_rc=${rc[0]} grep_rc=${rc[1]}"
          { [ "${rc[0]}" -eq 0 ] && [ "${rc[1]}" -eq 0 ]; } || fail=1
          exit $fail

      - name: Setup smoke test (installed stdlib outside the checkout)
        run: |
          ./target/debug/hella setup --force
          mkdir -p /tmp/hella-setup-smoke
          printf 'import std::io\nint main() do\n    println("hi")\n    return 0\nend\n' > /tmp/hella-setup-smoke/smoke.hll
          ./target/debug/hella check -f /tmp/hella-setup-smoke/smoke.hll
