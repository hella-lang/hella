[package]
name = "hella-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { version = "0.10", features = ["llvm21-1"] }
logos = "0.16.1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "1.1.6"
semver = "1"

[lib]
name = "hella_compiler"
path = "src/lib.rs"
