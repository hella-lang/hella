[package]
name = "hella-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
hella-compiler = { workspace = true }
hella-fmt = { workspace = true }
lsp-server = "0.10.0"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "hella_lsp"
path = "src/lib.rs"
